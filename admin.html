<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ระบบจัดการร้านอาหาร</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Kanit', 'sans-serif'] } } }
        }
    </script>
    <style> 
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans h-screen flex overflow-hidden">

    <!-- Modal ล็อกอินเข้าสู่ระบบแอดมิน -->
    <div id="loginModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md border border-slate-100 text-center">
            <div class="w-16 h-16 bg-[#1b1e2c] rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg shadow-slate-200">
                <i class="fa-solid fa-lock text-white"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-1">เข้าสู่ระบบแอดมิน</h2>
            <p class="text-xs text-slate-500 mb-6">กรุณากรอกรหัสผ่านเพื่อเข้าใช้งานระบบจัดการข้อมูล</p>
            
            <form onsubmit="checkAdminLogin(event)" class="space-y-4">
                <div>
                    <input type="password" id="adminPasswordInput" required placeholder="กรอกรหัสผ่านแอดมิน..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-center font-medium focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition-all">
                </div>
                <button type="submit" class="w-full py-3 bg-[#1b1e2c] text-white font-semibold rounded-xl hover:bg-gray-800 transition-all shadow-md">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" 
           onmouseenter="if(sidebarTimer) clearTimeout(sidebarTimer)" 
           onmouseleave="if(this.classList.contains('w-64')) startSidebarTimer()" 
           class="w-64 bg-[#1b1e2c] text-gray-300 flex flex-col h-full shadow-xl shrink-0 transition-all duration-300 overflow-hidden z-20">
        
        <div class="p-5 flex items-center gap-3 border-b border-gray-700/50 w-64">
            <div class="text-3xl text-purple-400"><i class="fa-solid fa-gear"></i></div>
            <div>
                <h1 class="text-white font-bold text-lg leading-none tracking-wide">Admin Panel</h1>
                <p class="text-[10px] text-gray-400 mt-1">ระบบจัดการข้อมูลร้านอาหาร</p>
            </div>
        </div>
        
        <nav class="flex-grow p-3 space-y-5 overflow-y-auto sidebar-scroll w-64 mt-2">
            <div>
                <div class="text-amber-500 text-xs font-bold mb-2 flex items-center gap-2 px-2">
                    <i class="fa-solid fa-burger"></i> ข้อมูลอาหารและหมวดหมู่
                </div>
                <div class="space-y-1">
                    <button onclick="switchTab('foodItems')" id="btn-foodItems" class="tab-btn w-full text-left flex items-center gap-3 px-3 py-2.5 text-gray-300 hover:bg-[#2a2d3e] hover:text-white rounded-lg transition-all text-sm border-l-4 border-transparent">
                        <i class="fa-solid fa-utensils w-5 text-center text-amber-400"></i> ข้อมูลรายการอาหารทั้งหมด
                    </button>
                    <button onclick="switchTab('foodNames')" id="btn-foodNames" class="tab-btn w-full text-left flex items-center gap-3 px-3 py-2.5 text-gray-300 hover:bg-[#2a2d3e] hover:text-white rounded-lg transition-all text-sm border-l-4 border-transparent">
                        <i class="fa-solid fa-font w-5 text-center text-blue-400"></i> ข้อมูลชื่อรายการอาหาร
                    </button>
                    <button onclick="switchTab('categories')" id="btn-categories" class="tab-btn w-full text-left flex items-center gap-3 px-3 py-2.5 text-gray-300 hover:bg-[#2a2d3e] hover:text-white rounded-lg transition-all text-sm border-l-4 border-transparent">
                        <i class="fa-solid fa-tags w-5 text-center text-green-400"></i> ข้อมูลหมวดหมู่
                    </button>
                </div>
            </div>
        </nav>
    </aside>

    <!-- Main Content Body -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
        
        <header class="bg-white shadow-sm px-4 py-3 sm:px-6 flex items-center justify-between z-10 shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-gray-500 hover:text-gray-800 text-xl border rounded px-2 py-1 transition-colors" title="เปิด/ปิด เมนู">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h2 id="current-title" class="text-lg sm:text-xl font-bold text-gray-800 flex items-center gap-2">
                    กำลังโหลดฐานข้อมูลระบบ...
                </h2>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-4">
                <div class="relative hidden lg:block">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-500 text-sm"></i>
                    <input type="text" id="searchInput" onkeyup="filterData()" placeholder="ค้นหาข้อมูลในตาราง..." class="pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-400 focus:bg-white w-64 transition-colors">
                </div>
                <button onclick="refreshCurrentTab()" class="bg-[#1b1e2c] text-white px-3 sm:px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 hover:bg-gray-800 transition-colors shadow-sm whitespace-nowrap">
                    <i class="fa-solid fa-arrows-rotate"></i> <span class="hidden sm:inline">รีเฟรช</span>
                </button>
                <div id="dynamic-action-buttons" class="flex items-center gap-2"></div>
            </div>
        </header>

        <section class="flex-1 overflow-auto p-4 sm:p-6 bg-[#f8fafc]">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr id="table-head" class="bg-gray-50 border-b border-gray-200 text-gray-600 text-sm font-semibold tracking-wide">
                                <th class="p-4">กำลังโหลด...</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-100 text-gray-700 text-sm">
                            <tr>
                                <td class="px-6 py-12 text-center text-slate-400">
                                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-300 border-t-slate-800 mb-2"></div>
                                    <p>กำลังเชื่อมต่อฐานข้อมูลระบบ...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal เพิ่ม/แก้ไข ข้อมูล -->
    <div id="dataModal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all">
            <div class="flex justify-between items-center p-5 border-b border-gray-100 bg-white">
                <h3 id="modalTitle" class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-teal-600"></i> เพิ่มข้อมูลใหม่
                </h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="modalForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto bg-white">
                <div id="modalFormFields" class="grid grid-cols-1 gap-4"></div>
                <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeModal()" class="px-5 py-2 text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">ยกเลิก</button>
                    <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-lg text-sm font-medium shadow-sm transition-colors">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกข้อมูล
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwQ91zi9VNLYP-e_916Tu6my5O4oIZVEbZ2-yZixtwkYZCKsEswIrvXA4pVlIS3M7qZ2A/exec"; 

        let ALL_DATA = {};
        let currentActiveTab = "foodItems"; 
        let editingRowIndex = null;
        let sidebarTimer = null;

        const schemas = {
            foodItems: { title: "ข้อมูลรายการอาหารทั้งหมด", sheet: "Menu", fields: ["ชื่อรายการอาหาร", "หมวดหมู่", "ราคา", "รูปภาพ"] },
            foodNames: { title: "ข้อมูลชื่อรายการอาหาร", sheet: "List", fields: ["ชื่อรายการอาหาร"] },
            categories: { title: "ข้อมูลหมวดหมู่", sheet: "Category", fields: ["หมวดหมู่"] }
        };

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            if (sidebar.classList.contains("w-64")) closeSidebar();
            else openSidebar();
        }

        function openSidebar() {
            const sidebar = document.getElementById("sidebar");
            sidebar.classList.remove("w-0");
            sidebar.classList.add("w-64");
            startSidebarTimer();
        }

        function closeSidebar() {
            const sidebar = document.getElementById("sidebar");
            sidebar.classList.remove("w-64");
            sidebar.classList.add("w-0");
            if (sidebarTimer) clearTimeout(sidebarTimer);
        }

        function startSidebarTimer() {
            if (sidebarTimer) clearTimeout(sidebarTimer);
            sidebarTimer = setTimeout(() => { closeSidebar(); }, 3500);
        }

        function showLoadingPopup(titleText = "กำลังโหลดข้อมูล...", subText = "กรุณารอสักครู่ ระบบกำลังดึงข้อมูลฐานข้อมูล") {
            Swal.fire({
                title: titleText,
                text: subText,
                allowOutsideClick: false,
                allowEscapeKey: false,
                showConfirmButton: false,
                didOpen: () => { Swal.showLoading(); }
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            if (sessionStorage.getItem("adminAuth") === "true") {
                document.getElementById("loginModal").classList.add("hidden");
                loadAllData();
            } else {
                document.getElementById("loginModal").classList.remove("hidden");
            }
        });

        async function checkAdminLogin(e) {
            e.preventDefault();
            const inputPass = document.getElementById("adminPasswordInput").value.trim();
            if (!inputPass) return;

            showLoadingPopup("กำลังตรวจสอบรหัสผ่าน...", "กรุณารอสักครู่");
            try {
                const res = await fetch(`${API_URL}?action=verifyAdminPassword&password=${encodeURIComponent(inputPass)}`);
                const result = await res.json();
                
                if (result.result === "success") {
                    sessionStorage.setItem("adminAuth", "true");
                    document.getElementById("loginModal").classList.add("hidden");
                    Swal.fire({ icon: "success", title: "เข้าสู่ระบบสำเร็จ", timer: 1200, showConfirmButton: false });
                    loadAllData();
                } else {
                    Swal.fire({ icon: "error", title: "เข้าสู่ระบบล้มเหลว", text: result.message || "รหัสผ่านไม่ถูกต้อง" });
                }
            } catch (err) {
                console.error(err);
                Swal.fire({ icon: "error", title: "ข้อผิดพลาด", text: "ไม่สามารถเชื่อมต่อระบบได้" });
            }
        }

        async function loadAllData() {
            renderLoading();
            showLoadingPopup("กำลังโหลดฐานข้อมูล...", "ระบบกำลังดึงข้อมูลทั้งหมดจาก Google Sheets");

            try {
                const response = await fetch(`${API_URL}?action=getAdminAllData`);
                const data = await response.json();
                ALL_DATA = data || {};
                switchTab(currentActiveTab);
            } catch (err) {
                console.error(err);
                Swal.fire("ข้อผิดพลาด", "ไม่สามารถดึงข้อมูลจากฐานข้อมูลได้", "error");
            } finally {
                Swal.close();
            }
        }

        function switchTab(tabKey) {
            closeSidebar(); 
            currentActiveTab = tabKey;
            editingRowIndex = null;
            
            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.classList.remove("bg-[#2a2d3e]", "text-white", "border-amber-500", "font-medium", "shadow-sm");
                btn.classList.add("text-gray-300", "border-transparent");
            });

            const activeBtn = document.getElementById(`btn-${tabKey}`);
            if (activeBtn) {
                activeBtn.classList.remove("text-gray-300", "border-transparent");
                activeBtn.classList.add("bg-[#2a2d3e]", "text-white", "border-amber-500", "font-medium", "shadow-sm");
            }

            const schema = schemas[tabKey];
            if (schema) {
                document.getElementById("current-title").innerText = schema.title;
            }

            const actionBtnsContainer = document.getElementById("dynamic-action-buttons");
            actionBtnsContainer.innerHTML = `
                <button onclick="openAddModal()" class="bg-teal-600 text-white px-3 sm:px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 hover:bg-teal-700 transition-colors shadow-sm whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i> เพิ่มข้อมูลใหม่
                </button>
            `;

            document.getElementById("searchInput").value = "";
            renderTable();
        }

        function renderTable(filterText = "") {
            const schema = schemas[currentActiveTab];
            const thead = document.getElementById("table-head");
            const tbody = document.getElementById("table-body");

            if (!schema) return;

            let tableFields = currentActiveTab === "foodItems" ? ["รูปภาพ", "ชื่อรายการอาหาร", "หมวดหมู่", "ราคา"] : schema.fields;

            let headHTML = "";
            tableFields.forEach(f => {
                let wClass = f === "รูปภาพ" ? "w-24" : "";
                headHTML += `<th class="p-4 ${wClass}">${f}</th>`;
            });
            headHTML += `<th class="p-4 text-center w-40">จัดการ</th>`;
            thead.innerHTML = headHTML;

            const list = ALL_DATA[currentActiveTab] || [];
            let filteredList = list;

            if (filterText.trim() !== "") {
                const q = filterText.toLowerCase();
                filteredList = list.filter(item => JSON.stringify(item).toLowerCase().includes(q));
            }

            if (filteredList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${tableFields.length + 1}" class="px-6 py-12 text-center text-gray-400">ไม่พบข้อมูลในระบบ</td></tr>`;
                return;
            }

            let bodyHTML = "";
            filteredList.forEach((item, index) => {
                bodyHTML += `<tr class="hover:bg-gray-50 transition-colors">`;
                
                tableFields.forEach(f => {
                    let val = item[f] !== undefined && item[f] !== null ? item[f] : "-";
                    
                    if (f === "รูปภาพ") {
                        if(val !== "-") {
                            bodyHTML += `<td class="p-3"><img src="${val}" class="w-12 h-12 object-cover rounded-lg border border-gray-200 shadow-sm" onerror="this.src='https://placehold.co/100x100?text=No+Image'"></td>`;
                        } else {
                            bodyHTML += `<td class="p-3"><div class="w-12 h-12 bg-gray-100 rounded-lg border border-gray-200 flex items-center justify-center text-xs text-gray-400">ไม่มีรูป</div></td>`;
                        }
                    } else if (f === "ราคา") {
                        bodyHTML += `<td class="p-3 font-medium">฿${val}</td>`;
                    } else if (f === "หมวดหมู่") {
                        bodyHTML += `<td class="p-3"><span class="text-gray-500">${val}</span></td>`;
                    } else {
                        bodyHTML += `<td class="p-3 font-medium text-gray-900">${val}</td>`;
                    }
                });

                bodyHTML += `
                    <td class="p-3 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick="openEditModal(${index})" class="px-3 py-1.5 border border-amber-200 text-amber-600 bg-amber-50 hover:bg-amber-100 rounded-md text-xs transition-colors">แก้ไข</button>
                            <button onclick="deleteRow('${schema.sheet}', ${index + 2})" class="px-3 py-1.5 border border-red-200 text-red-500 bg-red-50 hover:bg-red-100 rounded-md text-xs transition-colors">ลบ</button>
                        </div>
                    </td>
                `;
                bodyHTML += `</tr>`;
            });
            tbody.innerHTML = bodyHTML;
        }

        function filterData() {
            const q = document.getElementById("searchInput").value;
            renderTable(q);
        }

        function refreshCurrentTab() {
            loadAllData();
        }

        function renderLoading() {
            document.getElementById("table-body").innerHTML = `
                <tr>
                    <td colspan="10" class="px-6 py-12 text-center text-gray-400">
                        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-300 border-t-teal-600 mb-2"></div>
                        <p>กำลังเชื่อมต่อฐานข้อมูลระบบ...</p>
                    </td>
                </tr>
            `;
        }

        function generateFormFieldHTML(f, val = "") {
            val = (val !== undefined && val !== null) ? String(val).trim() : "";

            if (f === "ชื่อรายการอาหาร" && currentActiveTab === "foodItems") {
                const list = ALL_DATA.foodNames || [];
                let optHTML = list.map(item => {
                    let itemVal = typeof item === 'object' ? (item["ชื่อรายการอาหาร"] || item[Object.keys(item)[0]] || "") : item;
                    itemVal = String(itemVal).trim();
                    return `<option value="${itemVal}" ${itemVal === val ? 'selected' : ''}>${itemVal}</option>`;
                }).join("");
                return `
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1">${f}</label>
                        <select name="${f}" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 bg-gray-50 focus:bg-white">
                            <option value="">-- เลือกชื่อรายการอาหาร --</option>
                            ${optHTML}
                        </select>
                    </div>`;
            }

            if (f === "รูปภาพ") {
                return `
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1">ลิงก์รูปภาพ (URL)</label>
                        <input type="text" name="${f}" value="${val}" placeholder="https://..." class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 bg-gray-50 focus:bg-white">
                    </div>`;
            }

            if (f === "หมวดหมู่" && currentActiveTab === "foodItems") {
                const list = ALL_DATA.categories || [];
                let optHTML = list.map(item => {
                    let itemVal = typeof item === 'object' ? (item["หมวดหมู่"] || item["ชื่อหมวดหมู่"] || item[Object.keys(item)[0]] || "") : item;
                    itemVal = String(itemVal).trim();
                    return `<option value="${itemVal}" ${itemVal === val ? 'selected' : ''}>${itemVal}</option>`;
                }).join("");
                return `
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1">${f}</label>
                        <select name="${f}" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 bg-gray-50 focus:bg-white">
                            <option value="">-- เลือกหมวดหมู่ --</option>
                            ${optHTML}
                        </select>
                    </div>`;
            }

            let inputType = f === "ราคา" ? "number" : "text";
            return `
                <div>
                    <label class="text-sm font-medium text-gray-700 block mb-1">${f}</label>
                    <input type="${inputType}" name="${f}" value="${val}" placeholder="กรอก${f}..." class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 bg-gray-50 focus:bg-white">
                </div>
            `;
        }

        function openAddModal() {
            editingRowIndex = null;
            const schema = schemas[currentActiveTab];
            document.getElementById("modalTitle").innerHTML = `<i class="fa-solid fa-plus text-teal-600"></i> เพิ่มข้อมูลใน ${schema.title}`;
            
            let fieldsHTML = "";
            schema.fields.forEach(f => { fieldsHTML += generateFormFieldHTML(f, ""); });

            document.getElementById("modalFormFields").innerHTML = fieldsHTML;
            document.getElementById("dataModal").classList.remove("hidden");
            document.getElementById("dataModal").classList.add("flex");
        }

        function openEditModal(index) {
            editingRowIndex = index;
            const schema = schemas[currentActiveTab];
            const item = (ALL_DATA[currentActiveTab] || [])[index];
            if (!item) return;

            document.getElementById("modalTitle").innerHTML = `<i class="fa-solid fa-pen-to-square text-teal-600"></i> แก้ไขข้อมูลใน ${schema.title}`;
            
            let fieldsHTML = "";
            schema.fields.forEach(f => {
                const currentVal = item[f] !== undefined && item[f] !== null ? item[f] : "";
                fieldsHTML += generateFormFieldHTML(f, currentVal);
            });

            document.getElementById("modalFormFields").innerHTML = fieldsHTML;
            document.getElementById("dataModal").classList.remove("hidden");
            document.getElementById("dataModal").classList.add("flex");
        }

        function closeModal() {
            document.getElementById("dataModal").classList.add("hidden");
            document.getElementById("dataModal").classList.remove("flex");
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const schema = schemas[currentActiveTab];
            const formData = new FormData(e.target);
            let payload = {
                action: editingRowIndex !== null ? "updateAdminRecord" : "addAdminRecord",
                sheetName: schema.sheet
            };

            if (editingRowIndex !== null) {
                payload.rowNum = editingRowIndex + 2;
            }

            schema.fields.forEach(f => {
                payload[f] = formData.get(f) || "";
            });

            showLoadingPopup('กำลังบันทึกข้อมูล...', 'กำลังบันทึกข้อมูลเข้าสู่ระบบ Google Sheets');

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                
                const resultText = await res.text();
                let result = JSON.parse(resultText);

                if (result.result === "success") {
                    closeModal();
                    Swal.fire("สำเร็จ", "บันทึกข้อมูลเรียบร้อยแล้ว", "success");
                    loadAllData();
                } else {
                    Swal.fire("ผิดพลาด", result.message || "ไม่สามารถบันทึกข้อมูลได้", "error");
                }
            } catch (err) {
                Swal.fire("ผิดพลาด", err.message || "เกิดปัญหาในการส่งข้อมูล", "error");
            }
        }

        async function deleteRow(sheetName, rowNum) {
            const res = await Swal.fire({
                title: "ยืนยันการลบ?",
                text: "ต้องการลบรายการนี้ออกจากระบบใช่หรือไม่",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "ลบข้อมูล",
                cancelButtonText: "ยกเลิก",
                confirmButtonColor: "#e11d48"
            });

            if (res.isConfirmed) {
                showLoadingPopup("กำลังลบข้อมูล...", "กรุณารอสักครู่");
                try {
                    const response = await fetch(`${API_URL}?action=deleteAdminRecord&sheetName=${sheetName}&rowNum=${rowNum}`);
                    const result = await response.json();
                    if (result.result === "success") {
                        Swal.fire("ลบสำเร็จ", "ลบข้อมูลเรียบร้อยแล้ว", "success");
                        loadAllData();
                    } else {
                        Swal.fire("ผิดพลาด", result.message || "ลบไม่สำเร็จ", "error");
                    }
                } catch (e) {
                    Swal.fire("ผิดพลาด", "ไม่สามารถติดต่อเซิร์ฟเวอร์ได้", "error");
                }
            }
        }
    </script>
