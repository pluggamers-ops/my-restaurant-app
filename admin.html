<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเมนูอาหาร (Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">⚙️ จัดการรายการและราคาอาหาร</h1>
            <button onclick="openModal()" class="bg-yellow-500 hover:bg-yellow-600 text-white font-medium px-4 py-2 rounded-lg shadow">
                + เพิ่มเมนูใหม่
            </button>
        </div>

        <!-- ตารางรายการอาหาร -->
        <div class="bg-white rounded-xl shadow overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                        <th class="p-4">รูปภาพ</th>
                        <th class="p-4">ชื่อเมนู</th>
                        <th class="p-4">หมวดหมู่</th>
                        <th class="p-4">ราคา (บาท)</th>
                        <th class="p-4 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="menu-table-body">
                    <tr><td colspan="5" class="text-center p-6 text-gray-400">กำลังโหลดข้อมูลเมนู...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal เพิ่ม/แก้ไข เมนู -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-lg">
            <h2 id="modal-title" class="text-xl font-bold mb-4">เพิ่มเมนูใหม่</h2>
            <input type="hidden" id="item-id">
            
            <div class="space-y-3">
                <div>
                    <label class="text-sm font-medium">ชื่อเมนู</label>
                    <input type="text" id="item-name" class="w-full border p-2 rounded-lg mt-1 outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="text-sm font-medium">ราคา (บาท)</label>
                    <input type="number" id="item-price" class="w-full border p-2 rounded-lg mt-1 outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="text-sm font-medium">หมวดหมู่</label>
                    <input type="text" id="item-category" placeholder="เช่น จานผัดรสเด็ดจัดจ้าน" class="w-full border p-2 rounded-lg mt-1 outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="text-sm font-medium">ลิงก์รูปภาพ (URL)</label>
                    <input type="text" id="item-image" class="w-full border p-2 rounded-lg mt-1 outline-none focus:border-yellow-500">
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeModal()" class="px-4 py-2 text-gray-500">ยกเลิก</button>
                <button onclick="saveMenu()" id="btn-save" class="bg-yellow-500 text-white px-5 py-2 rounded-lg font-medium">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQCD5pRR0-FHwsSzk26xmqgoNo42mSAS9yWyBKp3eEUxLMwA7zarqwuWKjcd5oq3XyBA/exec';
        let menuItems = [];

        function fetchMenu() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.result === 'success') {
                        menuItems = data.menu;
                        renderTable();
                    }
                });
        }

        function renderTable() {
            const tbody = document.getElementById('menu-table-body');
            if (menuItems.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center p-6 text-gray-400">ยังไม่มีรายการอาหาร</td></tr>';
                return;
            }
            tbody.innerHTML = menuItems.map(item => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3"><img src="${item.image}" class="w-12 h-12 object-cover rounded-lg"></td>
                    <td class="p-3 font-medium">${item.name}</td>
                    <td class="p-3 text-sm text-gray-500">${item.category}</td>
                    <td class="p-3 font-semibold text-yellow-600">฿${item.price}</td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="editMenu('${item.id}')" class="text-blue-500 hover:underline">แก้ไข</button>
                        <button onclick="deleteMenu('${item.id}')" class="text-red-500 hover:underline">ลบ</button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal() {
            document.getElementById('item-id').value = '';
            document.getElementById('item-name').value = '';
            document.getElementById('item-price').value = '';
            document.getElementById('item-category').value = '';
            document.getElementById('item-image').value = '';
            document.getElementById('modal-title').innerText = 'เพิ่มเมนูใหม่';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function editMenu(id) {
            const item = menuItems.find(i => i.id == id);
            if (!item) return;
            document.getElementById('item-id').value = item.id;
            document.getElementById('item-name').value = item.name;
            document.getElementById('item-price').value = item.price;
            document.getElementById('item-category').value = item.category;
            document.getElementById('item-image').value = item.image;
            document.getElementById('modal-title').innerText = 'แก้ไขเมนู';
            document.getElementById('modal').classList.remove('hidden');
        }

        function saveMenu() {
            const id = document.getElementById('item-id').value;
            const name = document.getElementById('item-name').value;
            const price = document.getElementById('item-price').value;
            const category = document.getElementById('item-category').value;
            const image = document.getElementById('item-image').value;

            if(!name || !price) return alert('กรุณากรอกชื่อและราคาให้ครบถ้วน');

            const btn = document.getElementById('btn-save');
            btn.innerText = 'กำลังบันทึก...';
            btn.disabled = true;

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'saveMenuItem',
                    id: id,
                    name: name,
                    price: price,
                    category: category,
                    image: image
                })
            })
            .then(res => res.json())
            .then(res => {
                alert('บันทึกเรียบร้อย!');
                closeModal();
                btn.innerText = 'บันทึก';
                btn.disabled = false;
                fetchMenu();
            });
        }

        function deleteMenu(id) {
            if(!confirm('ยืนยันที่จะลบเมนูนีหรือไม่?')) return;
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'deleteMenuItem', id: id })
            })
            .then(res => res.json())
            .then(res => {
                alert('ลบเรียบร้อย!');
                fetchMenu();
            });
        }

        fetchMenu();
    </script>
</body>
</html>
