<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ระบบจัดการร้านอาหาร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { font-family: 'Kanit', sans-serif; }
        /* ซ่อน scrollbar สำหรับเมนูด้านข้างแต่ยัง scroll ได้ */
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <!-- Sidebar (แถบเมนูด้านซ้าย) -->
    <aside class="w-64 bg-[#1b1e2c] text-gray-300 flex flex-col hidden md:flex flex-shrink-0 h-full z-20 shadow-xl transition-all">
        <!-- Header โลโก้ -->
        <div class="p-5 flex items-center gap-3 border-b border-gray-700/50">
            <div class="text-3xl text-purple-400"><i class="fa-solid fa-gear"></i></div>
            <div>
                <h1 class="text-white font-bold text-lg leading-none tracking-wide">Admin Panel</h1>
                <p class="text-[10px] text-gray-400 mt-1">ระบบจัดการข้อมูลร้านอาหาร</p>
            </div>
        </div>

        <!-- รายการเมนู -->
        <nav class="flex-1 overflow-y-auto sidebar-scroll p-3 space-y-5 mt-2">
            
            <!-- Group 1: จัดการเมนู -->
            <div>
                <div class="text-amber-500 text-xs font-bold mb-2 flex items-center gap-2 px-2">
                    <i class="fa-solid fa-burger"></i> ข้อมูลอาหารและหมวดหมู่
                </div>
                <div class="space-y-1">
                    <a href="#" class="flex items-center gap-3 bg-[#2a2d3e] text-white px-3 py-2.5 rounded-lg font-medium shadow-sm border-l-4 border-amber-500">
                        <i class="fa-solid fa-list w-5 text-center text-amber-400"></i> ข้อมูลรายการอาหาร
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-[#2a2d3e] hover:text-white rounded-lg transition-colors text-sm">
                        <i class="fa-solid fa-tags w-5 text-center text-green-400"></i> ข้อมูลหมวดหมู่
                    </a>
                </div>
            </div>

            <!-- Group 2: Master Data -->
            <div>
                <div class="text-yellow-500 text-xs font-bold mb-2 flex items-center gap-2 px-2 uppercase">
                    <i class="fa-solid fa-database"></i> ข้อมูลระบบ (Master Data)
                </div>
                <div class="space-y-1 text-sm">
                    <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-[#2a2d3e] hover:text-white rounded-lg transition-colors">
                        <i class="fa-solid fa-chair w-5 text-center text-blue-400"></i> ข้อมูลโซน / โต๊ะ
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-[#2a2d3e] hover:text-white rounded-lg transition-colors">
                        <i class="fa-solid fa-users w-5 text-center text-pink-400"></i> ข้อมูลพนักงาน
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-[#2a2d3e] hover:text-white rounded-lg transition-colors">
                        <i class="fa-solid fa-store w-5 text-center text-teal-400"></i> ข้อมูลร้าน
                    </a>
                </div>
            </div>
        </nav>
    </aside>

    <!-- Main Content (พื้นที่เนื้อหาหลัก) -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden">
        
        <!-- แถบด้านบน (Top Bar) -->
        <header class="bg-white shadow-sm px-4 py-3 sm:px-6 flex items-center justify-between z-10">
            <div class="flex items-center gap-3">
                <button class="md:hidden text-gray-500 hover:text-gray-800 text-xl border rounded px-2 py-1"><i class="fa-solid fa-bars"></i></button>
                <h2 class="text-lg sm:text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-bars text-gray-500 text-lg"></i> ข้อมูลรายการอาหาร
                </h2>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-4">
                <!-- ช่องค้นหา -->
                <div class="relative hidden lg:block">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-blue-500 text-sm"></i>
                    <input type="text" placeholder="ค้นหาข้อมูลในตาราง..." class="pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-400 focus:bg-white w-64 transition-colors">
                </div>
                <!-- ปุ่มรีเฟรช -->
                <button onclick="fetchMenu()" class="bg-[#1b1e2c] text-white px-3 sm:px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 hover:bg-gray-800 transition-colors shadow-sm whitespace-nowrap">
                    <i class="fa-solid fa-arrows-rotate"></i> <span class="hidden sm:inline">รีเฟรช</span>
                </button>
                <!-- ปุ่มเพิ่มข้อมูล -->
                <button onclick="openModal()" class="bg-teal-600 text-white px-3 sm:px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 hover:bg-teal-700 transition-colors shadow-sm whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i> เพิ่มข้อมูลใหม่
                </button>
            </div>
        </header>

        <!-- พื้นที่ตารางข้อมูล -->
        <main class="flex-1 overflow-auto p-4 sm:p-6 bg-[#f8fafc]">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-sm font-semibold tracking-wide">
                                <th class="p-4 w-24">รูปภาพ</th>
                                <th class="p-4">ชื่อรายการอาหาร</th>
                                <th class="p-4">หมวดหมู่</th>
                                <th class="p-4">ราคา</th>
                                <th class="p-4 text-center w-40">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="menu-table-body" class="divide-y divide-gray-100 text-gray-700 text-sm">
                            <!-- จำลองข้อมูลให้เหมือนตัวอย่าง -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="p-3">
                                    <img src="https://via.placeholder.com/150" class="w-12 h-12 object-cover rounded-lg border border-gray-200 shadow-sm">
                                </td>
                                <td class="p-3 font-medium text-gray-900">ข้าวผัดสเต็กจัดจ้าน</td>
                                <td class="p-3"><span class="text-gray-500">อาหารจานเดียว</span></td>
                                <td class="p-3 font-medium">฿69.00</td>
                                <td class="p-3 text-center">
                                    <div class="flex justify-center gap-2">
                                        <button class="px-3 py-1.5 border border-amber-200 text-amber-600 bg-amber-50 hover:bg-amber-100 rounded-md text-xs transition-colors">แก้ไข</button>
                                        <button class="px-3 py-1.5 border border-red-200 text-red-500 bg-red-50 hover:bg-red-100 rounded-md text-xs transition-colors">ลบ</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Form (หน้าต่างป๊อปอัพ) -->
    <div id="modal" class="fixed inset-0 bg-gray-900/40 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-xl p-6 w-full max-w-lg shadow-2xl">
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-gray-100">
                <h3 id="modal-title" class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-teal-600"></i> ฟอร์มจัดการข้อมูล
                </h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4">
                <!-- โครงสร้างฟอร์มกรอกข้อมูล -->
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1">ชื่อรายการอาหาร <span class="text-red-500">*</span></label>
                        <input type="text" placeholder="กรอกชื่อเมนู" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 bg-gray-50 focus:bg-white">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-sm font-medium text-gray-700 block mb-1">ราคา (บาท) <span class="text-red-500">*</span></label>
                            <input type="number" placeholder="0.00" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 bg-gray-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-700 block mb-1">หมวดหมู่</label>
                            <select class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 bg-gray-50 focus:bg-white">
                                <option value="">-- เลือกหมวดหมู่ --</option>
                                <option value="1">อาหารจานเดียว</option>
                                <option value="2">เครื่องดื่ม</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-700 block mb-1">ลิงก์รูปภาพ (URL)</label>
                        <input type="text" placeholder="https://..." class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 bg-gray-50 focus:bg-white">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-gray-100">
                <button onclick="closeModal()" class="px-5 py-2 text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">ยกเลิก</button>
                <button class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-lg text-sm font-medium shadow-sm transition-colors">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> บันทึกข้อมูล
                </button>
            </div>
        </div>
    </div>

    <script>
        // การเปิด/ปิด Modal พื้นฐาน
        function openModal() {
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
        // สามารถนำฟังก์ชันดึงข้อมูลจาก Google Sheets (SCRIPT_URL) ของเดิมมาครอบในโครงสร้างนี้ได้เลย
    </script>
</body>
</html>
